[project]
name = "autords-backend"
version = "0.1.0"
description = "Local-first deterministic Reference Designation System"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "openpyxl>=3.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "rapidfuzz>=3.11",
  "reportlab>=4.2",
  "scikit-learn>=1.6",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3"]
dev = ["httpx>=0.28", "hypothesis>=6.122", "pytest>=8.3", "ruff>=0.9"]
packaging = ["pyinstaller>=6.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
